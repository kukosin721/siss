name: APK

# Compila el APK de debug en un runner de GitHub (el sandbox de desarrollo no tiene
# JDK ni SDK de Android). El resultado se publica en la rama `ci-apk` porque los
# artefactos de Actions no siempre se pueden descargar desde el sandbox; con la rama
# alcanza un `git fetch` para bajar el APK, el log y el keystore.
#
#   rama ci-apk:
#     waos-debug.apk     → APK de debug (sin optimizar; útil para probar cambios)
#     waos-release.apk   → APK de release con R8, firmado igual (rendimiento real)
#     debug.keystore     → keystore de debug estable (firma repetible entre builds)
#     status.txt         → OK / FAILED + sha, tamaño, estado del keystore
#     build.log          → cola del log de Gradle
#     ci-diag.txt        → traza del paso del keystore (set -x)

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      # Fija la ruta del keystore de debug en ~/.android (AGP la deriva de esta var).
      ANDROID_PREFS_ROOT: /home/runner
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Sin esto cada corrida genera un keystore de debug nuevo y el APK no se puede
      # instalar encima del anterior (INSTALL_FAILED_UPDATE_INCOMPATIBLE). El keystore
      # vive en la rama ci-apk y se reusa: firma estable entre builds.
      - name: Keystore de debug estable
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/ci-diag.txt") 2>&1
          set -x
          mkdir -p "$HOME/.android"
          git fetch origin ci-apk || true
          if git cat-file -e FETCH_HEAD:debug.keystore 2>/dev/null; then
            git show FETCH_HEAD:debug.keystore > "$HOME/.android/debug.keystore" || true
            echo "keystore restaurado de ci-apk"
          fi
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "generando keystore nuevo"
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" -storetype JKS \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" || echo "keytool rc=$?"
          fi
          ls -l "$HOME/.android/" || true
          which keytool || true
          java -version || true

      - name: Componentes del SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Platform/build-tools/NDK que falten los resuelve AGP; acá adelantamos
          # los que casi siempre hacen falta para no depender de la descarga implícita.
          for pkg in "platform-tools" "cmake;3.22.1"; do
            "$SDKMANAGER" --install "$pkg" > /dev/null 2>&1 || true
          done

      - name: Preparar Gradle
        run: |
          chmod +x gradlew
          # El gradle.properties del repo está afinado para el sandbox de 2 GB; en el
          # runner damos memoria de verdad para que Kotlin/AGP no se queden cortos.
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=4
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configuration-cache=false
          kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
          android.builder.sdkDownload=true
          EOF

      # APK de debug: el que sirve para probar cambios (más lento por no estar optimizado).
      - name: Build debug
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      # APK de release firmado con el mismo keystore: R8 activo, o sea el rendimiento real
      # (útil para juzgar fluidez). Si R8 rompe algo, el de debug sigue disponible.
      - name: Build release
        id: build_release
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            2>&1 | tee -a build.log

      - name: Publicar en la rama ci-apk
        if: always()
        run: |
          set -e
          out=/tmp/pub
          rm -rf "$out" && mkdir -p "$out" && cd "$out"
          git init -q
          git checkout -q --orphan ci-apk
          dbg="$(find "$GITHUB_WORKSPACE/app/build/outputs/apk/debug" -name '*.apk' 2>/dev/null | head -1 || true)"
          rel="$(find "$GITHUB_WORKSPACE/app/build/outputs/apk/release" -name '*.apk' 2>/dev/null | head -1 || true)"
          if [ -n "$dbg" ]; then cp "$dbg" waos-debug.apk; fi
          if [ -n "$rel" ]; then cp "$rel" waos-release.apk; fi
          if [ -n "$dbg" ] || [ -n "$rel" ]; then printf 'OK\n' > status.txt; else printf 'FAILED\n' > status.txt; fi
          printf 'commit=%s\ndebug=%s (%s)\nrelease=%s (%s)\n' \
            "$GITHUB_SHA" "${{ steps.build_debug.outcome }}" "$(basename "${dbg:-none}")" \
            "${{ steps.build_release.outcome }}" "$(basename "${rel:-none}")" >> status.txt
          # Firma estable: el keystore viaja con el APK para que el próximo build lo reuse.
          if [ -s "$HOME/.android/debug.keystore" ]; then
            cp "$HOME/.android/debug.keystore" debug.keystore
            printf 'keystore=stable\n' >> status.txt
          else
            printf 'keystore=missing\n' >> status.txt
            find "$HOME" -maxdepth 3 -name '*.keystore' >> status.txt 2>/dev/null || true
          fi
          tail -c 600000 "$GITHUB_WORKSPACE/build.log" > build.log 2>/dev/null || true
          tail -c 200000 "$GITHUB_WORKSPACE/ci-diag.txt" > ci-diag.txt 2>/dev/null || true
          git add -A
          git -c user.name="apk-bot" -c user.email="apk-bot@users.noreply.github.com" \
              commit -q -m "APK $(head -1 status.txt) ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-apk

      - name: Resumen
        if: always()
        run: |
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- debug: ${{ steps.build_debug.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- release: ${{ steps.build_release.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          ls -l app/build/outputs/apk/debug 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
