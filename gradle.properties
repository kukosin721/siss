# Overrides SOLO para el sandbox (2 GB de RAM). No se commitean.
org.gradle.jvmargs=-Xmx850m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx600m -XX:MaxMetaspaceSize=256m
kotlin.compiler.execution.strategy=in-process
